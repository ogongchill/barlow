management:
  endpoints:
    web:
      exposure:
        include: prometheus

---
spring.config.activate.on-profile: dev

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    enable:
      tomcat: true

---
spring.config.activate.on-profile: staging

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    enable:
      tomcat: true